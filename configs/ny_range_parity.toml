# Parity run against TradingView: BINANCE:BTCUSDT 5m, "NY 4H Range Re-entry (BTCUSDT 5m)"
# with every input at its Pine default. TradingView Properties: capital 3,000, commission
# 0.1%, slippage 2 ticks, 95% of equity (set by the script). The script has no Start or End,
# so the window starts well before TradingView's first 5m candle; the parity test compares
# only the trades inside TradingView's loaded history (tests/test_parity_ny_range.py).
name = "ny_range_parity"

[data]
symbol = "BTCUSDT"
interval = "5m"
data_dir = "data"

[strategy]
name = "ny_range"

[strategy.params]
range_session = "0000-0400"
include_weekends = true
sl_buffer_pct = 0.1
rr = 2.0
tp_mode = "From entry"
thru_mode = "Enter in trend direction"
thru_factor = 0.5
midnight_exit = "Close all"
position_pct = 95
sizing_slip_ticks = 2
fee_reserve_pct = 0.05
# Compared with the candle close time; End is exclusive.
start = "2026-09-01T04:00:00Z"
end = "2099-01-01T00:00:00Z"

# TradingView strategy Properties and BINANCE:BTCUSDT symbol info
# (mintick 0.01, mincontract 0.00001, pointvalue 1).
[broker]
initial_capital = "3000"
commission_pct = "0.1"
slippage_ticks = 2
tick_size = "0.01"
lot_size = "0.00001"
point_value = "1"
fill_model = "tradingview"

[output]
runs_dir = "runs"
