# Parity run against TradingView: BINANCE:BTCUSDT 1h, "EMA 9 / Rolling VWAP Cross v1"
# with the daily trend filter ON (daily EMA 21). Window 2026-01-01 to 2026-10-24 UTC on
# time_close; indicators are warmed up on the full history before the window.
name = "ema_vwap_parity"

[data]
symbol = "BTCUSDT"
interval = "1h"
data_dir = "data"

[strategy]
name = "ema_vwap"

[strategy.params]
ema_length = 9
vwap_bars = 24
stop_atr = 2.0
atr_length = 14
use_trend = true
trend_length = 21
position_pct = 100
sizing_slip_ticks = 2
fee_reserve_pct = 0.05
direction = "Both"
start = "2026-01-01T00:00:00Z"
end = "2026-10-24T00:00:00Z"

# TradingView strategy Properties and BINANCE:BTCUSDT symbol info
# (mintick 0.01, mincontract 0.00001, pointvalue 1).
[broker]
initial_capital = "10000"
commission_pct = "0.05"
slippage_ticks = 2
tick_size = "0.01"
lot_size = "0.00001"
point_value = "1"
fill_model = "tradingview"

[output]
runs_dir = "runs"
