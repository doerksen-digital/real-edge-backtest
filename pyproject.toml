[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "real-edge-backtest"
version = "0.0.1"
description = "An honest backtesting tool for short-term crypto strategies."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Esra Dan Doerksen" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/doerksen-digital/real-edge-backtest"

[tool.hatch.build.targets.wheel]
packages = ["src/real_edge_backtest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
